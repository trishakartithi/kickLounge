buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.8.2"
        classpath "com.google.gms:google-services:4.4.0"
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
